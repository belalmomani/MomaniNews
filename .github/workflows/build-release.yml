name: Build signed release (AAB + APK)

# يدوي فقط. يحتاج 4 أسرار في المستودع (Settings > Secrets and variables > Actions > Secrets):
#   RELEASE_KEYSTORE_BASE64, RELEASE_KEYSTORE_PASSWORD, RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD
# الخطوات في docs/RELEASE.md. لا يعمل على طلبات السحب ولا على الفروع الخارجية.
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version 8.14.3; fi
          chmod +x ./gradlew
      - name: Decode keystore
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KS" || { echo "RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.keystore"
      - name: Compute version
        # versionCode = دقائق منذ 1/1/2026 UTC: يزيد دائماً ويتفق مع build-apk وpublish-release (يشترطه Google Play ومقارن التحديث).
        run: |
          CODE=$(( ($(date -u +%s) - 1767225600) / 60 ))
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "NAME=0.3.$CODE" >> "$GITHUB_ENV"

      - name: Build
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testReleaseUnitTest bundleRelease assembleRelease "-PversionCode=$CODE" "-PversionName=$NAME" "-PprivacyUrl=${{ vars.PRIVACY_URL }}" --stacktrace
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: MomaniNews-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
