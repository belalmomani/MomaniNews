name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests and build debug APK
        env:
          # اختياري: متغير مستودع (Settings > Secrets and variables > Actions > Variables) برابط API عبر https.
          # إن لم يُعرَّف يُبنى التطبيق ببيانات تجريبية. الرابط عام وليس سراً.
          ORG_GRADLE_PROJECT_apiBaseUrl: ${{ vars.API_BASE_URL }}
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MomaniNews-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
