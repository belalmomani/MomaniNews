name: Build Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Android SDK مثبّت مسبقاً على runner ubuntu-24.04، فلا نستخدم setup-android (فشل في تثبيت حزمة tools المحذوفة).
      # نقبل التراخيص فقط؛ AGP ينزّل المنصة وأدوات البناء المطلوبة تلقائياً.
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3

      - name: Make wrapper executable
        run: |

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version 8.14.3; fi

          chmod +x ./gradlew

      - name: Run unit tests and build debug APK
        run: ./gradlew testDebugUnitTest assembleDebug "-PprivacyUrl=${{ vars.PRIVACY_URL }}" --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MomaniNews-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
