name: Discover news sources

# اكتشاف مصادر جديدة وتحديث سجل المصادر (مستقل عن الجلب اليومي). أسبوعياً + يدوي.
# يحتاج الترحيل supabase/migrations/20261021120000_source_discovery.sql وسرّي SUPABASE_URL و SUPABASE_SERVICE_ROLE_KEY.
on:
  schedule:
    - cron: "17 3 * * 0,3"   # الأحد والأربعاء 03:17 UTC (قد يتأخر GitHub بضع دقائق)
  workflow_dispatch: {}

concurrency:
  group: discover-sources
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run unit tests
        working-directory: fetcher
        run: python -m unittest discover -s tests -t .
      - name: Discover
        working-directory: fetcher
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python -m momani_fetcher.discover
