name: Publish APK release (for in-app updates)

# يدوي فقط. يبني نسخة APK ويرفعها كإصدار على GitHub مع ملف البصمة SHA-256،
# ثم يجدها زر «البحث عن تحديثات» في إعدادات التطبيق. المستودع يجب أن يكون عاماً (Public).
# versionCode = دقائق منذ 1/1/2026 UTC (يزيد دائماً ويتفق مع build-apk.yml).
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "ملاحظات الإصدار (تظهر للمستخدم)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version 8.14.3; fi
          chmod +x ./gradlew
      - name: Compute version
        run: |
          # نفس صيغة build-apk.yml (دقائق منذ 1/1/2026 UTC) كي يتفق ترتيب النسختين دائماً
          CODE=$(( ($(date -u +%s) - 1767225600) / 60 ))
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "NAME=0.3.$CODE" >> "$GITHUB_ENV"
      - name: Build
        run: ./gradlew testDebugUnitTest assembleDebug "-PversionCode=$CODE" "-PversionName=$NAME" "-PprivacyUrl=${{ vars.PRIVACY_URL }}" --stacktrace
      - name: Prepare files
        run: |
          mkdir out
          cp app/build/outputs/apk/debug/app-debug.apk "out/MomaniNews-$NAME.apk"
          (cd out && sha256sum "MomaniNews-$NAME.apk" > "MomaniNews-$NAME.apk.sha256")
          cat "out/MomaniNews-$NAME.apk.sha256"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          gh release create "build-$CODE" out/* --title "$NAME" --notes "${NOTES:-إصدار $NAME}" --latest
