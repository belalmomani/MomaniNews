name: Build release AAB

# يدوي فقط. يحتاج أسرار المستودع (Settings > Secrets and variables > Actions > Secrets):
#   RELEASE_KEYSTORE_BASE64   ملف مفتاح الإصدار بترميز base64
#   RELEASE_KEYSTORE_PASSWORD كلمة مرور الملف
#   RELEASE_KEY_ALIAS         اسم المفتاح
#   RELEASE_KEY_PASSWORD      كلمة مرور المفتاح
on:
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Accept Android SDK licenses
        run: yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

        with:

          gradle-version: 8.14.3

      - name: Check secrets exist
        env:
          K: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$K" ]; then echo "RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1; fi

      - name: Restore keystore (temporary file on the runner)
        env:
          K: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: echo "$K" | base64 --decode > "$RUNNER_TEMP/release.keystore"

      - run: |

          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then gradle wrapper --gradle-version 8.14.3; fi

          chmod +x ./gradlew

      - name: Compute version
        # versionCode = دقائق منذ 1/1/2026 UTC: يزيد دائماً ويتفق مع build-apk وpublish-release (يشترطه Google Play ومقارن التحديث).
        run: |
          CODE=$(( ($(date -u +%s) - 1767225600) / 60 ))
          echo "CODE=$CODE" >> "$GITHUB_ENV"
          echo "NAME=0.3.$CODE" >> "$GITHUB_ENV"

      - name: Unit tests and bundleRelease
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew testDebugUnitTest bundleRelease "-PversionCode=$CODE" "-PversionName=$NAME" "-PprivacyUrl=${{ vars.PRIVACY_URL }}" --stacktrace

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: MomaniNews-release-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
